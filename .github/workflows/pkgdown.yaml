# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: Update website (pkgdown)

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.ref }}
      cancel-in-progress: false
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REPOS: "c(mokymai = 'https://mokymai.github.io/download/', CRAN = 'https://cran.rstudio.com')"

    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::devtools, github::GegznaV/backup.tools, github::GegznaV/snippets, local::.
          needs: website

      - name: Generate Rd files for website
        run: |
          devtools::document(roclets = c('rd', 'collate', 'namespace'))
        shell: Rscript {0}

      - name: Render README
        run: |
          rmarkdown::render(
            "README.Rmd",
            output_format = rmarkdown::github_document(html_preview = FALSE)
          )
        shell: Rscript {0}

      - name: Commit generated documentation
        if: github.ref_type == 'branch' && (github.ref_name == 'master' || github.ref_name == 'main')
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -- NAMESPACE man README.md

          if git diff --cached --quiet; then
            echo "Generated documentation is current"
            exit 0
          fi

          git commit -m "Update generated documentation [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            if [[ "${attempt}" -eq 3 ]]; then
              echo "Failed to publish generated documentation after ${attempt} attempts" >&2
              exit 1
            fi
          done

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
