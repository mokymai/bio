on:
  push:
    branches: [master, main]
  workflow_dispatch:

name: Publish package (drat)

permissions:
  contents: read

concurrency:
  group: drat-publish-mokymai-download
  cancel-in-progress: false

jobs:
  drat:
    runs-on: ${{ matrix.config.os }}

    name: "drat: ${{ matrix.config.os }} (R-${{ matrix.config.r }})"

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'oldrel'}
          - {os: macOS-latest,   r: 'release'}
          - {os: macOS-latest,   r: 'oldrel'}
          # - {os: windows-latest, r: 'devel'}
          # - {os: macOS-latest,   r: 'devel'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT:  ${{ secrets.GITHUB_TOKEN }}
      SOURCE_REPO: ${{ github.repository }}
      DEST_REPO:   mokymai/download
      TMP_DIR:     tmp_dir
      R_REPOS:     "c(mokymai = 'https://mokymai.github.io/download/', CRAN = 'https://cran.rstudio.com')"

    steps:
      - uses: actions/checkout@v4

      - name: Info
        run: |
          echo "GitHub actor: ${{ github.actor }}"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            roxygen2
            devtools
            drat

      - name: Roxygenize
        shell: Rscript {0}
        run:   roxygen2::roxygenize()

      - name: Build source package
        if: runner.os == 'Windows' && matrix.config.r == 'release'
        shell: Rscript {0}
        run: |
          dir.create("check", showWarnings = FALSE)
          devtools::build(path = "check")

      - name: Build binary package
        if: runner.os != 'Linux'
        shell: Rscript {0}
        run: |
            dir.create("check", showWarnings = FALSE)
            devtools::build(path = "check", binary = TRUE)

# The steps to include the built package in ${DEST_REPO}
      - name: Git clone DEST_REPO
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEST_REPO }} # 'mokymai/download'
          ref:   'master'
          path:  "${{ env.TMP_DIR }}"
          # `git pull --rebase` in the publication step needs a full history.
          fetch-depth: 0
          token: "${{ secrets.DEPLOY_DRAT_TOKEN }}"

      - name: Drat -- insert
        if: success()
        shell: Rscript {0}
        run: |
          built_packages <-
            list.files(
              path       = "check",
              pattern    = "[.]tar[.]gz$|[.]tgz$|[.]zip$",
              full.names = TRUE
            )

          built_packages

          for (i in seq_along(built_packages)) {
            drat::insertPackages(
              file    = built_packages[i],
              repodir = Sys.getenv("TMP_DIR"),
              action  = "archive"
            )
          }

      - name: Drat -- commit and push
        if: success()
        shell: bash
        run: |
          cd "${TMP_DIR}" # move into the subdir, which is Git controlled
          R_VERSION="$(Rscript -e 'cat(as.character(getRversion()))')"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions | ${{ github.event.repository.name }}"
          git add --all

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Update from ${SOURCE_REPO} ${{ runner.os }} R-${R_VERSION}"

          for attempt in 1 2 3; do
            # Guarded so `bash -e` cannot abort the step on the first race.
            if git pull --rebase origin master && git push origin master; then
              exit 0
            fi

            git rebase --abort || true

            if [[ "${attempt}" -eq 3 ]]; then
              echo "Failed to publish after ${attempt} attempts" >&2
              exit 1
            fi

            sleep $((attempt * 5))
          done

