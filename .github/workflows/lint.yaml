name: Lint

on:
  push:
    branches: [main, master, devel]
  pull_request:
    branches: [main, master, devel]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REPOS: "c(mokymai = 'https://mokymai.github.io/download/', CRAN = 'https://cran.rstudio.com')"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::styler, local::.
          needs: lint

      - name: Run lintr
        run: lintr::lint_package()
        shell: Rscript {0}

      - name: Check styler parse
        run: |
          styler::style_dir("R", strict = FALSE, dry = "fail")
          styler::style_dir("tests", strict = FALSE, dry = "fail")
        shell: Rscript {0}
