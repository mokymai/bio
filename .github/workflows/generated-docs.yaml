name: Update generated documentation

on:
  pull_request:
    branches: [main, master, devel]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generated-docs:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REPOS: "c(mokymai = 'https://mokymai.github.io/download/', CRAN = 'https://cran.rstudio.com')"
      CAN_PUSH: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "2.14"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::rmarkdown, github::GegznaV/backup.tools, github::GegznaV/snippets, local::.
          needs: website

      - name: Generate Rd files
        run: |
          devtools::document(roclets = c('rd', 'collate', 'namespace'))
        shell: Rscript {0}

      - name: Check Rd contracts
        run: |
          issues <- tools::checkDocFiles(dir = ".")
          print(issues)
          if (length(issues)) quit(status = 1)
        shell: Rscript {0}

      - name: Render README
        run: |
          rmarkdown::render(
            "README.Rmd",
            output_format = rmarkdown::github_document(html_preview = FALSE)
          )
        shell: Rscript {0}

      - name: Commit generated documentation
        if: env.CAN_PUSH == 'true'
        shell: bash
        run: |
          git add -- NAMESPACE man README.md

          if git diff --cached --quiet; then
            echo "Generated documentation is current"
            exit 0
          fi

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit -m "Update generated documentation [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase origin "${HEAD_BRANCH}"

            if git push origin "HEAD:${HEAD_BRANCH}"; then
              exit 0
            fi

            if [[ "${attempt}" -eq 3 ]]; then
              echo "Failed to publish generated documentation after ${attempt} attempts" >&2
              exit 1
            fi
          done

      - name: Create generated documentation patch
        if: env.CAN_PUSH != 'true'
        shell: bash
        run: |
          git add -- NAMESPACE man README.md
          git diff --cached --binary -- NAMESPACE man README.md > generated-docs.patch

      - name: Upload generated documentation patch
        if: env.CAN_PUSH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-documentation-patch
          path: generated-docs.patch
          if-no-files-found: error
