# ----------------------------------------------------------------------------

url: https://mokymai.github.io/bio

destination: docs

template:
  bootstrap: 5
  light-switch: true
  bootswatch: sandstone
  bootswatch_dark: darkly

# ----------------------------------------------------------------------------
# Search: pkgdown 2.x indexes the whole site with fuse.js and builds
# `search.json` itself. The only supported key here would be `exclude`.

# ----------------------------------------------------------------------------

development:
  mode: auto

# ----------------------------------------------------------------------------

authors:
  Vilmantas Gegzna:
    href: https://orcid.org/0000-0002-9500-5167

# ----------------------------------------------------------------------------

navbar:
  structure:
    left:  [home, version, intro, articles, tutorials, reference, news]
    right: [github]
  components:
    version:
      icon: fa-book
      menu:
      - text: "Documentation for version of package:"
      - text: Released
        href: https://mokymai.github.io/bio/
      - text: In-development
        href: https://mokymai.github.io/bio/dev/

